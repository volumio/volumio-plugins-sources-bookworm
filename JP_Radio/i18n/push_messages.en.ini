# ================================================
# Volumio Plugin Push Message Table
# Note: text after "#" is treated as a comment and cannot be used as a message
# ================================================

# Common
APP_TITLE = JP Radio

# Boot / Status
BOOT_COMPLETED = Started
ALREADY_STARTED = Already started
STOPPED = Stopped
SETTINGS_SAVED = Settings saved (applied immediately, no restart needed)

# Error
ERROR_BOOT_TITLE = JP Radio Boot Error
ERROR_START_FAILED_TITLE = JP Radio Failed to Start
ERROR_PORT_IN_USE = Port {0} is already in use. JP Radio cannot start.
ERROR_UNKNOWN = Unknown error
ERROR_GENERIC = Error

# Program
PROGRAM_DATA_GETTING = Program data: fetching...
PROGRAM_DATA_DONE = Program data: fetch complete! {0}ms

# Album art
STATION_LOGO_CLEAR = Station logo cache cleared. This takes effect after the plugin restarts.

# Playback fallback / Favourites
ERROR_INVALID_TIMEFREE_PARAMS = The Time-Free playback info was invalid, so playback switched to live.
WARNING_SWITCH_LIVE_FUTURE = This program hasn't aired yet, so playback switched to live.
WARNING_SWITCH_LIVE_CATCHUP = This program is currently on air, so playback switched to live.
FAVOURITE_ADDED = Added {0} to Favourites.
FAVOURITE_UPDATED = Updated the Favourite entry for {0}.
FAVOURITE_REMOVED = Removed {0} from Favourites.

# UI (English system messages, not translated)
RESTART_FAILED_TITLE = Restart Failed
RESTART_FAILED_MESSAGE = The plugin could not be restarted.
RESTART_MODAL_TITLE = Plugin Restart Required
RESTART_MODAL_MESSAGE = Changes have been made that require the JP Radio plugin to be restarted. Please click the restart button below.
