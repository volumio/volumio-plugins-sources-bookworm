# ================================================
# Volumio Plugin Push Message Table
# 注意: 「#」以降はコメントとして使用されるためメッセージとして使用不可
# ================================================

# 共通
APP_TITLE = JP Radio

# Boot / Status
BOOT_COMPLETED = 起動しました
ALREADY_STARTED = すでに起動しています
STOPPED = 停止しました
SETTINGS_SAVED = 設定を保存しました(再起動不要で反映されます)

# Error
ERROR_BOOT_TITLE = JP Radio 起動エラー
ERROR_START_FAILED_TITLE = JP Radio 起動失敗
ERROR_PORT_IN_USE = ポート {0} はすでに使用中です。JP Radio を開始できません。
ERROR_UNKNOWN = 不明なエラー
ERROR_GENERIC = エラー

# Program
PROGRAM_DATA_GETTING = 番組データ：取得中...
PROGRAM_DATA_DONE = 番組データ：取得完了！ {0}ms

# Album art
STATION_LOGO_CLEAR = 局ロゴキャッシュを削除しました。プラグイン再起動後に反映されます。

# Playback fallback / Favourites
ERROR_INVALID_TIMEFREE_PARAMS = タイムフリーの再生情報が不正なため、ライブ再生に切り替えました。
WARNING_SWITCH_LIVE_FUTURE = まだ配信されていない番組のため、ライブ再生に切り替えました。
WARNING_SWITCH_LIVE_CATCHUP = 放送中の番組のため、ライブ再生に切り替えました。
FAVOURITE_ADDED = {0} をお気に入りに追加しました。
FAVOURITE_UPDATED = {0} のお気に入り登録を更新しました。
FAVOURITE_REMOVED = {0} をお気に入りから削除しました。

# UI (English system messages, not translated)
RESTART_FAILED_TITLE = Restart Failed
RESTART_FAILED_MESSAGE = The plugin could not be restarted.
RESTART_MODAL_TITLE = Plugin Restart Required
RESTART_MODAL_MESSAGE = Changes have been made that require the JP Radio plugin to be restarted. Please click the restart button below.
