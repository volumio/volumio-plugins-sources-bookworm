        octaveTableEl.innerHTML = html;
      }

      // ========== Crosshair snapping ==========

      function findSnapFrequency(mx) {
        if (!lastResponses || !lastResponses.individual) return null;
        var closest = null;
        var closestDist = Infinity;
        for (var i = 0; i < lastResponses.individual.length; i++) {
          var ind = lastResponses.individual[i];
          if (!isFilterVisible(ind.scope)) continue;
          var filterFreq = ind.type === 'Tilt' ? 1000 : ind.params[0];
          if (filterFreq < fMin || filterFreq > fMax) continue;
          var fx = freqToX(filterFreq);
          var dist = Math.abs(mx - fx);
          if (dist < closestDist && dist <= SNAP_THRESHOLD_PX) {
            closestDist = dist;
            closest = { freq: filterFreq, x: fx, filterIndex: i };
          }
        }
        return closest;
      }

      // ========== Data fetching ==========

      function fetchAndRender() {
        if (interacting) return;
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/peq', true);
        xhr.timeout = 5000;
        xhr.onload = function () {
          if (xhr.status === 200) {
            try {
              currentData = JSON.parse(xhr.responseText);
              currentMode = currentData.mode || 'PEQ';
              errorMsg.style.display = 'none';
              samplerateEl.textContent = currentData.sampleRate || '--';
              // Show/hide buttons based on mode
              var isEQ15 = (currentMode === 'EQ15' || currentMode === '2XEQ15');
              btnAddFilter.style.display = isEQ15 ? 'none' : '';
              btnSave.style.display = isEQ15 ? 'none' : '';
              btnReset.style.display = isEQ15 ? 'none' : '';
              // Show bypass button only in graphic EQ modes
              var isGraphicEq = isEQ15 || currentMode === 'EQ3';
              btnBypassEq.style.display = isGraphicEq ? '' : 'none';
              eqBypassed = !!currentData.eqbypass;
              updateBypassButton();
              var responses = computeResponses(currentData);
              lastResponses = responses;
              updateChannelToggleVisibility(responses);
              updateLegend(responses);
              updateOctaveTable(responses);
              var peakGainEl = document.getElementById('peakgain-info');
              currentPeakGain = computePeakFromResponses(responses);
              if (currentPeakGain > 0) {
                peakGainEl.textContent = '| Peak: +' + currentPeakGain.toFixed(1) + ' dB';
                peakGainEl.style.color = '#e9a645';
              } else {
                peakGainEl.textContent = '| Peak: ' + currentPeakGain.toFixed(1) + ' dB';
                peakGainEl.style.color = '#AAA';
              }
              resizeCanvas();
              render(responses);
              lastDbMin = render.dbMin || -15;
              lastDbMax = render.dbMax || 15;
            } catch (e) {
              errorMsg.style.display = 'block';
            }
          } else {
            errorMsg.style.display = 'block';
          }
        };
        xhr.onerror = function () {
          errorMsg.style.display = 'block';
        };
        xhr.send();
      }

      // ========== Mouse event helpers ==========

      function getMousePos(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function getTouchPos(e) {
        var rect = canvas.getBoundingClientRect();
        var touch = e.touches[0] || e.changedTouches[0];
        return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
      }

      function updateCrosshair(mx, my) {
        var w = canvas.width / dpr;
        var h = canvas.height / dpr;
        if (mx >= margin.left && mx <= w - margin.right &&
          my >= margin.top && my <= h - margin.bottom) {
          // Check for snap to filter frequency
          var snap = findSnapFrequency(mx);
          var displayFreq, isSnapped;
          if (snap) {
            displayFreq = snap.freq;
            snappedState = snap;
            isSnapped = true;
          } else {
            displayFreq = xToFreq(mx);
            snappedState = null;
            isSnapped = false;
          }
          var db = yToDb(my, render.dbMin || -15, render.dbMax || 15);
          var prefix = isSnapped ? '\u25C6 ' : '';
          var text = prefix + Math.round(displayFreq) + ' Hz / ' + db.toFixed(1) + ' dB';
          // Compute combined response at cursor/snapped frequency
          if (lastResponses) {
            var combinedDb = 0;
            for (var i = 0; i < lastResponses.individual.length; i++) {
              var ind = lastResponses.individual[i];
              if (!isFilterVisible(ind.scope)) continue;
              if (ind.biquads && ind.biquads.length > 0) {
                combinedDb += evalBiquadMagnitudeDb(ind.biquads, displayFreq, lastResponses.sampleRate);
              }
            }
            text += ' / combined: ' + combinedDb.toFixed(1) + ' dB';
          }
          crosshairInfo.style.display = 'block';
          crosshairInfo.textContent = text;
          // Style tooltip when snapped
          if (isSnapped) {
            crosshairInfo.style.borderColor = '#54C688';
            crosshairInfo.style.boxShadow = '0 0 6px rgba(84, 198, 136, 0.5)';
          } else {
            crosshairInfo.style.borderColor = '#54C688';
            crosshairInfo.style.boxShadow = 'none';
          }
          if (window.innerWidth <= 480) {
            crosshairInfo.style.whiteSpace = 'normal';
            crosshairInfo.style.maxWidth = 'calc(100vw - 24px)';
            crosshairInfo.style.width = 'auto';
          } else {
            crosshairInfo.style.whiteSpace = 'nowrap';
            crosshairInfo.style.maxWidth = 'none';
            crosshairInfo.style.width = 'auto';
          }
          var infoX = mx + 15;
          var infoY = my - 25;
          var infoRect = crosshairInfo.getBoundingClientRect();
          var infoW = infoRect.width;
          var infoH = infoRect.height;
          if (infoX + infoW > w) infoX = mx - infoW - 15;
          if (infoX < 12) infoX = 12;
          if (infoY < 0) infoY = my + 15;
          if (infoY + infoH > h) infoY = h - infoH - 12;
          crosshairInfo.style.left = infoX + 'px';
          crosshairInfo.style.top = infoY + 'px';
        } else {
          crosshairInfo.style.display = 'none';
          snappedState = null;
        }
      }

      function updateCursor(mx, my) {
        if (dragging) {
          canvas.style.cursor = 'grabbing';
          return;
        }
        var hit = hitTestMarker(mx, my, lastResponses);
        if (hit >= 0) {
          var isEQ15Mode = (currentMode === 'EQ15' || currentMode === '2XEQ15');
          canvas.style.cursor = isEQ15Mode ? 'ns-resize' : 'pointer';
          if (hoveredFilterIndex !== hit) {
            hoveredFilterIndex = hit;
            renderLocal();
          }
        } else {
          canvas.style.cursor = 'crosshair';
          if (hoveredFilterIndex !== -1) {
            hoveredFilterIndex = -1;
            renderLocal();
          }
        }
      }

      function applyDrag(mx, my) {
        if (dragFilterIndex < 0 || !lastResponses || dragFilterIndex >= lastResponses.individual.length) return;
        var ind = lastResponses.individual[dragFilterIndex];
        var meta = filterTypeMeta[ind.type];
        if (!meta || !meta.draggable) return;
        var isEQ15 = (currentMode === 'EQ15' || currentMode === '2XEQ15');

        // Find the filter in currentData
        var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
        if (fIdx >= 0) {
          var newParams = currentData.filters[fIdx].params.slice();
          // Clamp mouse to plot area
          var w = canvas.width / dpr;
          var h = canvas.height / dpr;
          var clampedX = Math.max(margin.left, Math.min(mx, w - margin.right));
          var clampedY = Math.max(margin.top, Math.min(my, h - margin.bottom));
          // Update frequency from X (locked in EQ15 mode)
          if (!isEQ15) {
            var newFreq = xToFreq(clampedX);
            newFreq = Math.max(1, Math.min(22049, newFreq));
            newParams[0] = Math.round(newFreq * 10) / 10;
          }
          // Update gain from Y if applicable
          if (meta.hasGain) {
            var newGain = yToDb(clampedY, lastDbMin, lastDbMax);
            var gainLimit = isEQ15 ? 10 : 20;
            newGain = Math.max(-gainLimit, Math.min(gainLimit, newGain));
            newParams[1] = Math.round(newGain * 100) / 100;
          }
          currentData.filters[fIdx].params = newParams;
        }

        var responses = computeResponses(currentData);
        if (responses) {
          lastResponses = responses;
          resizeCanvas();
          render(responses);
          updateLegend(responses);
        }
      }

      // ========== Mouse event handlers ==========

      canvas.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        if (selectedFilterIndex >= 0) {
          revertAndClosePopup();
        }
        var pos = getMousePos(e);
        var hit = hitTestMarker(pos.x, pos.y, lastResponses);
        if (hit < 0) return;

        var ind = lastResponses.individual[hit];
        var meta = filterTypeMeta[ind.type];
        if (!meta) return;

        e.preventDefault();
        interacting = true;
        clearInteractionTimer();
        dragFilterIndex = hit;
        dragStartX = pos.x;
        dragStartY = pos.y;
        dragMoved = false;
        // Save original params for revert
        var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
        if (fIdx >= 0) {
          dragOriginalParams = currentData.filters[fIdx].params.slice();
        }
        canvas.style.cursor = 'grabbing';
        dragging = true;
      });

      canvas.addEventListener('mousemove', function (e) {
        var pos = getMousePos(e);
        mouseX = pos.x;
        mouseY = pos.y;

        if (dragFilterIndex >= 0) {
          var dx = pos.x - dragStartX;
          var dy = pos.y - dragStartY;
          if (!dragMoved && (dx * dx + dy * dy > 9)) {
            dragMoved = true;
          }
          if (dragMoved) {
            var ind = lastResponses.individual[dragFilterIndex];
            var meta = filterTypeMeta[ind.type];
            if (meta && meta.draggable) {
              applyDrag(pos.x, pos.y);
            }
            updateCrosshair(pos.x, pos.y);
          }
          return;
        }

        if (dragging) {
          updateCrosshair(pos.x, pos.y);
        } else {
          crosshairInfo.style.display = 'none';
        }

        updateCursor(pos.x, pos.y);

        // Re-render for crosshair
        if (currentData && !dragging) {
          var responses = computeResponses(currentData);
          if (responses) {
            lastResponses = responses;
            render(responses);
          }
        }
      });

      canvas.addEventListener('mouseup', function (e) {
        if (e.button !== 0) return;
        var pos = getMousePos(e);

        if (dragFilterIndex >= 0) {
          var fi = dragFilterIndex;
          var ind = lastResponses.individual[fi];

          if (dragMoved) {
            // Drag completed - POST updated params
            dragging = false;
            dragFilterIndex = -1;
            canvas.style.cursor = 'pointer';
            var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
            if (fIdx >= 0) {
              postFilterUpdate(ind.index, currentData.filters[fIdx].params, null, null, ind.scope, function (err) {
                if (err) {
                  // Revert on error
                  var rIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
                  if (rIdx >= 0) {
                    currentData.filters[rIdx].params = dragOriginalParams;
                  }
                  renderLocal();
                }
                dragOriginalParams = null;
                scheduleInteractionEnd();
              });
            }
          } else {
            // Click (no drag) - show popup
            dragFilterIndex = -1;
            dragging = false;
            dragOriginalParams = null;
            showPopup(fi);
          }
        }
        crosshairInfo.style.display = 'none';
      });

      canvas.addEventListener('mouseleave', function () {
        mouseX = -1;
        mouseY = -1;
        hoveredFilterIndex = -1;
        snappedState = null;
        crosshairInfo.style.display = 'none';
        if (dragFilterIndex >= 0 && dragMoved) {
          // Treat as drag end
          var ind = lastResponses.individual[dragFilterIndex];
          dragging = false;
          dragFilterIndex = -1;
          canvas.style.cursor = 'default';
          var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
          if (fIdx >= 0) {
            postFilterUpdate(ind.index, currentData.filters[fIdx].params, null, null, ind.scope, function () {
              dragOriginalParams = null;
              scheduleInteractionEnd();
            });
          }
        } else {
          dragFilterIndex = -1;
          dragging = false;
          dragOriginalParams = null;
        }
        if (currentData) {
          var responses = computeResponses(currentData);
          if (responses) { lastResponses = responses; render(responses); }
        }
      });

      // ========== Touch event handlers ==========

      canvas.addEventListener('touchstart', function (e) {
        if (selectedFilterIndex >= 0) {
          revertAndClosePopup();
        }
        var pos = getTouchPos(e);
        var hit = hitTestMarker(pos.x, pos.y, lastResponses);
        if (hit < 0) return;

        var ind = lastResponses.individual[hit];
        var meta = filterTypeMeta[ind.type];
        if (!meta) return;

        e.preventDefault();
        interacting = true;
        clearInteractionTimer();
        dragFilterIndex = hit;
        dragStartX = pos.x;
        dragStartY = pos.y;
        dragMoved = false;
        var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
        if (fIdx >= 0) {
          dragOriginalParams = currentData.filters[fIdx].params.slice();
        }
        dragging = true;
      }, { passive: false });

      canvas.addEventListener('touchmove', function (e) {
        if (dragFilterIndex < 0) return;
        e.preventDefault();
        var pos = getTouchPos(e);
        mouseX = pos.x;
        mouseY = pos.y;
        var dx = pos.x - dragStartX;
        var dy = pos.y - dragStartY;
        if (!dragMoved && (dx * dx + dy * dy > 9)) {
          dragMoved = true;
        }
        if (dragMoved) {
          var ind = lastResponses.individual[dragFilterIndex];
          var meta = filterTypeMeta[ind.type];
          if (meta && meta.draggable) {
            applyDrag(pos.x, pos.y);
          }
          updateCrosshair(pos.x, pos.y);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function (e) {
        if (dragFilterIndex < 0) return;
        e.preventDefault();
        var fi = dragFilterIndex;
        var ind = lastResponses.individual[fi];

        if (dragMoved) {
          dragging = false;
          dragFilterIndex = -1;
          var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
          if (fIdx >= 0) {
            postFilterUpdate(ind.index, currentData.filters[fIdx].params, null, null, ind.scope, function (err) {
              if (err) {
                var rIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
                if (rIdx >= 0) {
                  currentData.filters[rIdx].params = dragOriginalParams;
                }
                renderLocal();
              }
              dragOriginalParams = null;
              scheduleInteractionEnd();
            });
          }
        } else {
          dragFilterIndex = -1;
          dragging = false;
          dragOriginalParams = null;
          showPopup(fi);
        }
        crosshairInfo.style.display = 'none';
      }, { passive: false });

      canvas.addEventListener('touchcancel', function () {
        if (dragFilterIndex >= 0 && dragOriginalParams) {
          var ind = lastResponses.individual[dragFilterIndex];
          var fIdx = findFilterIdx(currentData.filters, ind.index, ind.scope);
          if (fIdx >= 0) {
            currentData.filters[fIdx].params = dragOriginalParams;
          }
          renderLocal();
        }
        dragFilterIndex = -1;
        dragging = false;
        dragMoved = false;
        dragOriginalParams = null;
        scheduleInteractionEnd();
      });

      // ========== Window resize ==========

      window.addEventListener('resize', function () {
        dpr = window.devicePixelRatio || 1;
        resizeCanvas();
        if (currentData) {
          var responses = computeResponses(currentData);
          if (responses) {
            lastResponses = responses;
            lastDbMin = render.dbMin || -15;
            lastDbMax = render.dbMax || 15;
            render(responses);
            updateLegend(responses);
            updateOctaveTable(responses);
          }
        }
      });

      // ========== Unsaved changes tracking ==========

      function markUnsaved() {
        hasUnsavedChanges = true;
        unsavedDot.style.display = 'inline-block';
      }

      function markSaved() {
        hasUnsavedChanges = false;
        unsavedDot.style.display = 'none';
      }

      function showStatus(text, duration) {
        statusMsg.textContent = text;
        if (duration) {
          setTimeout(function () {
            if (statusMsg.textContent === text) statusMsg.textContent = '';
          }, duration);
        }
      }

      // ========== Save / Reset buttons ==========

      btnSave.addEventListener('click', function () {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/peq/save', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.onload = function () {
          if (xhr.status === 200) {
            markSaved();
            showStatus('Saved', 2000);
          } else {
            showStatus('Save failed', 2000);
          }
        };
        xhr.onerror = function () {
          showStatus('Network error', 2000);
        };
        xhr.send('{}');
      });

      btnReset.addEventListener('click', function () {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/peq/reset', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.onload = function () {
          if (xhr.status === 200) {
            markSaved();
            showStatus('Reset to saved', 2000);
            // Force re-fetch to update graph with restored data
            interacting = false;
            fetchAndRender();
          } else {
            showStatus('Reset failed', 2000);
          }
        };
        xhr.onerror = function () {
          showStatus('Network error', 2000);
        };
        xhr.send('{}');
      });

      // ========== Add Filter button ==========

      btnAddFilter.addEventListener('click', function () {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/peq/add', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.onload = function () {
          if (xhr.status === 200) {
            markUnsaved();
            showStatus('Filter added', 2000);
            interacting = false;
            fetchAndRender();
          } else {
            var msg = 'Add failed';
            try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) { }
            showStatus(msg, 3000);
          }
        };
        xhr.onerror = function () {
          showStatus('Network error', 2000);
        };
        xhr.send('{}');
      });

      // ========== Init ==========

      resizeCanvas();
      render(null);
      fetchAndRender();
      setInterval(fetchAndRender, 3000);

    })();
  </script>
<svg id="popup-connector-svg" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9998; display:none;">
  <line id="popup-connector-line" x1="0" y1="0" x2="0" y2="0" style="stroke:rgba(255,255,255,0.6); stroke-width:1.5;" />
</svg>
