<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FusionDSP - PEQ Frequency Response</title>
  <style>
    @font-face {
      font-family: General Sans;
      src: url('/fonts/GeneralSans-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: General Sans;
      src: url('/fonts/GeneralSans-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: General Sans;
      src: url('/fonts/GeneralSans-Semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: General Sans;
      src: url('/fonts/GeneralSans-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --olive-950: #1c1d1a;
      --olive-900: #1d2021;
      --olive-800: #252b2b;
      --olive-700: #2b3232;
      --olive-600: #3a4343;
      --olive-500: #4d5d5d;
      --olive-400: #98a0a0;
      --olive-300: #c1c7c7;
      --olive-200: #dfe4e4;
      --olive-100: #f4f5f5;
      --olive-50: #f8f9f9;
      --white: #ffffff;
      --black: #07070a;
      --brand-green: #51b289;
      --volumio-green: #51b289;
      --volumio-green-700: #3a8a68;
      --volumio-green-600: #459b76;
      --error-500: #f97066;
      --warning-500: #fbbf24;
      --info-500: #66b3ff;
      --bg-primary: #1b1f1f;
      --bg-secondary: #1f2626;
      --bg-tertiary: #272e2e;
      --bg-input: #2b3131;
      --bg-overlay: rgba(11, 14, 14, 0.72);
      --bg-scrim-strong: rgba(9, 12, 12, 0.9);
      --content-primary: #f3f5f5;
      --content-secondary: #b4bdbe;
      --content-tertiary: #8e9aa0;
      --content-disabled: #698082;
      --content-highlight: var(--volumio-green);
      --content-success: #47cd89;
      --content-error: var(--error-500);
      --content-warning: var(--warning-500);
      --content-hires: var(--info-500);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-control: rgba(255, 255, 255, 0.22);
      --border-default: rgba(255, 255, 255, 0.16);
      --fill-hover: rgba(255, 255, 255, 0.05);
      --fill-press: rgba(255, 255, 255, 0.08);
      --fill-selected: rgba(81, 178, 137, 0.18);
      --fill-hires: rgba(102, 179, 255, 0.12);
      --fill-track: rgba(255, 255, 255, 0.08);
      --radius-button: 9999px;
      --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.28);
      --font-sans: 'General Sans', 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--content-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 76px;
      padding: 16px 20px 14px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #header h1 {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--content-primary);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-button);
      background: rgba(255, 255, 255, 0.02);
      color: var(--content-primary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      touch-action: manipulation;
    }

    #back-btn:hover,
    #back-btn:active {
      background: var(--fill-hover);
      border-color: var(--border-control);
      transform: translateY(-1px);
    }

    #header-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: nowrap;
      margin-left: auto;
    }

    #status-msg {
      font-size: 11px;
      color: var(--content-secondary);
      letter-spacing: 0.01em;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #unsaved-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning-500);
      box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15);
      display: none;
      flex-shrink: 0;
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: var(--radius-button);
      border: 1px solid var(--border-default);
      background: rgba(255, 255, 255, 0.02);
      color: var(--content-primary);
      font: 500 12px/1 var(--font-sans);
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .header-btn:hover,
    .header-btn:active {
      background: var(--fill-hover);
      border-color: var(--border-control);
      transform: translateY(-1px);
    }

    .header-btn.active {
      background: rgba(81, 178, 137, 0.18);
      border-color: rgba(81, 178, 137, 0.5);
      color: var(--content-primary);
      box-shadow: inset 0 0 0 1px rgba(81, 178, 137, 0.15);
    }

    .header-btn.save-btn {
      background: rgba(81, 178, 137, 0.12);
      border-color: rgba(81, 178, 137, 0.36);
    }

    .header-btn.save-btn:hover,
    .header-btn.save-btn:active {
      background: rgba(81, 178, 137, 0.2);
      border-color: rgba(81, 178, 137, 0.52);
    }

    .header-btn.bypass-btn.active {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.46);
    }

    #info {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--content-secondary);
      font-size: 11px;
      line-height: 1;
      padding: 0 4px 0 0;
      white-space: nowrap;
    }

    #canvas-container {
      position: relative;
      flex: 1 1 auto;
      min-height: 260px;
      margin: 18px 20px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      overflow: hidden;
      background: var(--bg-secondary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), var(--shadow-md);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #crosshair-info {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      display: inline-block;
      background: var(--bg-secondary);
      border: 1px solid rgba(81, 178, 137, 0.6);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.3;
      color: var(--content-primary);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
      white-space: nowrap;
    }

    #error-msg {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      display: none;
      color: var(--content-error);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #octave-table {
      display: none;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      flex-shrink: 0;
      min-height: 50px;
      margin: 0 20px;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--bg-secondary);
      overflow-x: auto;
      font-family: 'SFMono-Regular', Consolas, monospace;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.18) transparent;
    }

    #octave-table::-webkit-scrollbar {
      height: 6px;
    }

    #octave-table::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }

    .octave-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 50px;
      padding: 6px 4px;
      border-right: 1px solid var(--border-subtle);
      color: var(--content-secondary);
    }

    .octave-col:last-child {
      border-right: none;
    }

    .octave-val {
      font-size: 10px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .octave-val.positive {
      color: #5ce0a9;
    }

    .octave-val.negative {
      color: #ff7d8d;
    }

    .octave-val.zero {
      color: var(--content-tertiary);
    }

    .octave-freq {
      font-size: 9px;
      line-height: 1.2;
      color: var(--content-tertiary);
      margin-top: 2px;
      white-space: nowrap;
    }

    #legend {
      display: none;
      flex-wrap: wrap;
      gap: 10px 14px;
      flex-shrink: 0;
      padding: 12px 20px 18px;
      color: var(--content-secondary);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
    }

    .legend-color {
      display: inline-block;
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: var(--content-highlight);
    }

    #filter-popup {
      position: fixed;
      z-index: 30;
      display: none;
      min-width: 280px;
      max-width: 340px;
      max-height: 30vh;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid rgba(81, 178, 137, 0.48);
      border-radius: 18px;
      background: var(--bg-secondary);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    #filter-popup .popup-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--content-highlight);
      margin-bottom: 8px;
    }

    #filter-popup .popup-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    #filter-popup .popup-row label {
      min-width: 86px;
      color: var(--content-secondary);
      font-size: 11px;
    }

    #filter-popup .popup-row input,
    #filter-popup .popup-row select {
      width: 100%;
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--border-default);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--content-primary);
      font: 500 12px/1.2 var(--font-sans);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    #filter-popup .popup-row input:focus,
    #filter-popup .popup-row select:focus {
      outline: none;
      border-color: rgba(81, 178, 137, 0.7);
      box-shadow: 0 0 0 3px rgba(81, 178, 137, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    #filter-popup .popup-row select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--content-secondary) 50%), linear-gradient(135deg, var(--content-secondary) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 11px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 32px;
    }

    #filter-popup .popup-error {
      min-height: 14px;
      margin: 2px 0 8px;
      color: var(--content-error);
      font-size: 10px;
    }

    #filter-popup .popup-buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    #filter-popup .popup-buttons button {
      flex: 1;
      min-height: 32px;
      border: 1px solid var(--border-default);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--content-primary);
      font: 600 11px/1.1 var(--font-sans);
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    #filter-popup .popup-buttons button:hover,
    #filter-popup .popup-buttons button:active {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    #filter-popup .popup-buttons button.apply-btn {
      background: rgba(81, 178, 137, 0.18);
      border-color: rgba(81, 178, 137, 0.5);
    }

    #filter-popup .popup-buttons button.delete-btn {
      background: rgba(249, 112, 102, 0.12);
      border-color: rgba(249, 112, 102, 0.38);
    }

    #filter-popup .popup-buttons button.mute-btn {
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.38);
    }

    #filter-popup .popup-buttons button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .knob-container svg {
      cursor: ns-resize;
    }

    .knob-label {
      font-size: 10px;
      color: var(--content-secondary);
      margin-top: 3px;
      white-space: nowrap;
    }

    .knob-value {
      display: block;
      margin-top: 4px;
    }

    .knob-value-input {
      width: 56px;
      padding: 3px 4px;
      border: 1px solid rgba(81, 178, 137, 0.5);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--content-primary);
      font: 600 11px/1.3 var(--font-sans);
      text-align: center;
      outline: none;
    }

    #popup-params-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 12px;
      padding: 4px 0;
    }

    .channel-toggle.active[id="btn-toggle-left"] {
      background: rgba(92, 224, 169, 0.18);
      border-color: rgba(92, 224, 169, 0.5);
    }

    .channel-toggle.active[id="btn-toggle-right"] {
      background: rgba(81, 143, 255, 0.16);
      border-color: rgba(81, 143, 255, 0.44);
    }

    @media (max-width: 768px) {
      #header {
        padding: 12px 14px 10px;
      }

      #header h1 {
        font-size: 14px;
      }

      #header-controls {
        gap: 6px;
      }

      .header-btn {
        min-height: 34px;
        padding: 7px 10px;
        font-size: 11px;
      }

      #canvas-container {
        margin: 12px 14px 10px;
        border-radius: 18px;
      }

      #octave-table {
        margin: 0 14px;
      }

      #legend {
        padding: 10px 14px 14px;
      }
    }

    @media (max-width: 480px) {
      #header {
        flex-wrap: wrap;
        align-items: center;
      }

      #header h1 {
        order: 0;
        width: auto;
      }

      #back-btn {
        order: -1;
      }

      #header-controls {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      #info {
        margin-left: 2px;
      }

      #crosshair-info {
        left: 12px !important;
        right: 12px !important;
        width: auto;
        white-space: normal;
      }
    }

    .theme-mode {
      min-height: 36px;
      max-width: 116px;
      padding: 6px 8px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-button);
      background: var(--bg-input);
      color: var(--content-primary);
      font: 500 12px/1 var(--font-sans);
    }

    :root[data-theme=light] {
      color-scheme: light;
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #eef0ee;
      --bg-input: #e9ebe8;
      --bg-overlay: rgba(28, 29, 26, 0.45);
      --content-primary: #1c1d1a;
      --content-secondary: #485555;
      --content-tertiary: #6e6f75;
      --content-disabled: #a6a7ac;
      --content-highlight: var(--volumio-green-700);
      --content-success: #2f9e6b;
      --content-error: #d9453b;
      --content-warning: #b4791a;
      --content-hires: #1559b0;
      --border-subtle: rgba(18, 23, 23, 0.08);
      --border-control: rgba(18, 23, 23, 0.18);
      --border-default: rgba(18, 23, 23, 0.12);
      --fill-hover: rgba(18, 23, 23, 0.04);
      --fill-press: rgba(18, 23, 23, 0.07);
      --fill-selected: rgba(81, 178, 137, 0.12);
      --shadow-md: 0 10px 24px rgba(18, 23, 23, 0.12);
    }

    :root[data-theme=light] body { background: var(--bg-primary); }
    :root[data-theme=light] #header,
    :root[data-theme=light] #canvas-container,
    :root[data-theme=light] #crosshair-info,
    :root[data-theme=light] #octave-table,
    :root[data-theme=light] #filter-popup { background: var(--bg-secondary); }

    input,
    button,
    select,
    textarea {
      font: inherit;
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <div id="header">
    <a id="back-btn" href="#"
      onclick="window.close(); setTimeout(function(){ if (!window.closed) history.back(); }, 100); return false;">&#9664;
      Back to Volumio</a>
    <h1>FusionDSP - PEQ Frequency Response</h1>
    <div id="header-controls">
      <span id="status-msg"></span>
      <span id="unsaved-dot" title="Unsaved changes"></span>
      <button class="header-btn bypass-btn" id="btn-bypass-eq" style="display:none;">Bypass EQ</button>
      <button class="header-btn" id="btn-add-filter">+ Add Filter</button>
      <button class="header-btn" id="btn-reset">Reset</button>
      <button class="header-btn save-btn" id="btn-save">Save</button>
      <button class="header-btn" id="btn-toggle-legend">Legend</button>
      <button class="header-btn" id="btn-toggle-octave">1/3 Oct</button>
            <select id="theme-mode" class="theme-mode" aria-label="PEQ graph theme">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
      <button class="header-btn channel-toggle active" id="btn-toggle-left" style="display:none;">L</button>
      <button class="header-btn channel-toggle active" id="btn-toggle-right" style="display:none;">R</button>
      <div id="info">Sample rate: <span id="samplerate">--</span> Hz <span id="peakgain-info"
          style="margin-left: 12px;"></span></div>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="graph"></canvas>
    <div id="crosshair-info"></div>
    <div id="error-msg">Unable to load PEQ data</div>
    <div id="filter-popup"></div>
  </div>
  <div id="octave-table"></div>
  <div id="legend"></div>

  <script>
    (function () {
      'use strict';

      var themeModeSelect = document.getElementById('theme-mode');

      function getThemePreference() {
        try {
          return localStorage.getItem('fusiondsp-theme-mode') || 'system';
        } catch (e) {
          return 'system';
        }
      }

      function applyGraphTheme() {
        var preference = getThemePreference();
        var dark = preference === 'dark' || (preference === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        if (themeModeSelect) themeModeSelect.value = preference;
        if (canvas && lastResponses) {
          resizeCanvas();
          render(lastResponses);
        }
      }

      applyGraphTheme();
      if (themeModeSelect) {
        themeModeSelect.addEventListener('change', function () {
          try {
            localStorage.setItem('fusiondsp-theme-mode', themeModeSelect.value);
          } catch (e) { }
          applyGraphTheme();
        });
      }
      if (window.matchMedia) {
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        if (prefersDark.addEventListener) {
          prefersDark.addEventListener('change', function () {
            if (getThemePreference() === 'system') applyGraphTheme();
          });
        }
      }

      function getCanvasThemePalette() {
        var style = getComputedStyle(document.documentElement);
        var light = document.documentElement.getAttribute('data-theme') === 'light';
        return {
          bg: style.getPropertyValue('--bg-primary').trim(),
          grid: style.getPropertyValue('--border-default').trim(),
          gridSoft: style.getPropertyValue('--border-subtle').trim(),
          text: style.getPropertyValue('--content-primary').trim(),
          secondary: style.getPropertyValue('--content-secondary').trim(),
          axis: style.getPropertyValue('--content-tertiary').trim(),
          accent: style.getPropertyValue('--content-highlight').trim(),
          crosshair: light ? 'rgba(0, 0, 0, 0.28)' : 'rgba(255, 255, 255, 0.3)'
        };
      }

      var canvas = document.getElementById('graph');
      var ctx = canvas.getContext('2d');
      var container = document.getElementById('canvas-container');
      var crosshairInfo = document.getElementById('crosshair-info');
      var legendEl = document.getElementById('legend');
      var samplerateEl = document.getElementById('samplerate');
      var errorMsg = document.getElementById('error-msg');

      var currentData = null;
      var currentMode = 'PEQ';

      function getKnobConfig(label, type) {
        var cfg = knobConfigs[label];

      // ========== SVG arc utilities ==========

      var ARC_START_DEG = -135;
      var ARC_END_DEG = 135;
      var ARC_RANGE_DEG = 270;
      var KNOB_SIZE = 56;
      var KNOB_CX = 28, KNOB_CY = 28, KNOB_R = 22;

      function polarToCartesian(cx, cy, r, angleDeg) {
        var rad = angleDeg * Math.PI / 180;
        return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
      }

      function describeArc(cx, cy, r, startDeg, endDeg) {
        var s = polarToCartesian(cx, cy, r, startDeg);
        var e = polarToCartesian(cx, cy, r, endDeg);
        var sweep = endDeg - startDeg;
        if (sweep < 0) sweep += 360;
        var largeArc = sweep > 180 ? 1 : 0;
        return 'M ' + s.x.toFixed(2) + ' ' + s.y.toFixed(2) +
          ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' +
          e.x.toFixed(2) + ' ' + e.y.toFixed(2);
      }

      // ========== Value mapping ==========

      function valueToNormalized(value, config) {
        if (config.scale === 'log') {
          if (value <= 0) value = config.min;
          return (Math.log(value) - Math.log(config.min)) / (Math.log(config.max) - Math.log(config.min));
        }
        if (config.scale === 'discrete') {
          var steps = config.steps;
          var idx = steps.indexOf(value);
          if (idx < 0) {
            idx = 0;
            for (var i = 1; i < steps.length; i++) {
              if (Math.abs(value - steps[i]) < Math.abs(value - steps[idx])) idx = i;
            }
          }
          return steps.length > 1 ? idx / (steps.length - 1) : 0;
        }
        return (value - config.min) / (config.max - config.min);
      }

      function normalizedToValue(norm, config) {
        norm = Math.max(0, Math.min(1, norm));
        if (config.scale === 'log') {
          return Math.exp(Math.log(config.min) + norm * (Math.log(config.max) - Math.log(config.min)));
        }
        if (config.scale === 'discrete') {
          var steps = config.steps;
          var idx = Math.round(norm * (steps.length - 1));
          return steps[Math.max(0, Math.min(steps.length - 1, idx))];
        }
        return config.min + norm * (config.max - config.min);
      }

      function quantizeValue(value, config) {
        if (config.scale === 'discrete') {
          var steps = config.steps;
          var closest = steps[0];
          var minDist = Math.abs(value - steps[0]);
          for (var i = 1; i < steps.length; i++) {
            var d = Math.abs(value - steps[i]);
            if (d < minDist) { minDist = d; closest = steps[i]; }
          }
          return closest;
        }
        value = Math.max(config.min, Math.min(config.max, value));
        if (config.step) {
          value = Math.round(value / config.step) * config.step;
        }
        return parseFloat(value.toFixed(config.decimals));

      // ========== Knob visual update ==========

        var tipEl = knobEl.querySelector('.knob-tip');
        var valEl = knobEl.querySelector('.knob-value');

        var isBipolar = config.center !== undefined;
        if (isBipolar) {
          var centerNorm = valueToNormalized(config.center, config);
          var centerAngle = ARC_START_DEG + centerNorm * ARC_RANGE_DEG;
          if (Math.abs(angle - centerAngle) < 0.5) {
            fillEl.setAttribute('d', '');
          } else if (angle > centerAngle) {
            fillEl.setAttribute('d', describeArc(KNOB_CX, KNOB_CY, KNOB_R, centerAngle, angle));
          } else {
            fillEl.setAttribute('d', describeArc(KNOB_CX, KNOB_CY, KNOB_R, angle, centerAngle));
          }
        } else {
          if (norm < 0.005) {
            fillEl.setAttribute('d', '');
          } else if (norm > 0.995) {
            fillEl.setAttribute('d', describeArc(KNOB_CX, KNOB_CY, KNOB_R, ARC_START_DEG, ARC_END_DEG - 0.1));
          } else {
            fillEl.setAttribute('d', describeArc(KNOB_CX, KNOB_CY, KNOB_R, ARC_START_DEG, angle));
          }

        ptrEl.setAttribute('x1', KNOB_CX + innerR * Math.sin(rad));
        ptrEl.setAttribute('y1', KNOB_CY - innerR * Math.cos(rad));
        ptrEl.setAttribute('x2', KNOB_CX + outerR * Math.sin(rad));
        ptrEl.setAttribute('y2', KNOB_CY - outerR * Math.cos(rad));

        tipEl.setAttribute('cy', KNOB_CY - outerR * Math.cos(rad));

        }

      // ========== Biquad coefficient computation ==========

      function computeBiquadCoeffs(type, params, sampleRate) {
        var w0, alpha, A, cosw0, sinw0, b0, b1, b2, a0, a1, a2;
        var freq, gain, Q, bandwidth, slope, order;
        var omega, sn, cs, k, kk, v0, H0, tn;

        switch (type) {
          case 'Peaking':
            freq = params[0]; gain = params[1]; Q = params[2];
            A = Math.pow(10, gain / 40);
            w0 = 2 * Math.PI * freq / sampleRate;
            sinw0 = Math.sin(w0); cosw0 = Math.cos(w0);
            alpha = sinw0 / (2 * Q);
            b0 = 1 + alpha * A;
            b1 = -2 * cosw0;
            b2 = 1 - alpha * A;
            a0 = 1 + alpha / A;
            a1 = -2 * cosw0;
            a2 = 1 - alpha / A;
            return [{ b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 }];

          case 'Peaking2':
            // Peaking with bandwidth in octaves
            freq = params[0]; gain = params[1]; bandwidth = params[2];
            A = Math.pow(10, gain / 40);
            w0 = 2 * Math.PI * freq / sampleRate;
            sinw0 = Math.sin(w0); cosw0 = Math.cos(w0);
            alpha = sinw0 * Math.sinh(Math.log(2) / 2 * bandwidth * w0 / sinw0);
            b0 = 1 + alpha * A;
            b1 = -2 * cosw0;
            b2 = 1 - alpha * A;
            a0 = 1 + alpha / A;
            a1 = -2 * cosw0;
            a2 = 1 - alpha / A;
            return [{ b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 }];

          case 'Lowshelf':
            // Lowshelf with slope S (dB/octave)
            freq = params[0]; gain = params[1]; slope = params[2];
            A = Math.pow(10, gain / 40);
            w0 = 2 * Math.PI * freq / sampleRate;
            sinw0 = Math.sin(w0); cosw0 = Math.cos(w0);
            alpha = sinw0 / 2 * Math.sqrt((A + 1 / A) * (1 / (slope / 12) - 1) + 2);
            var sqA = Math.sqrt(A);
            b0 = A * ((A + 1) - (A - 1) * cosw0 + 2 * sqA * alpha);
            b1 = 2 * A * ((A - 1) - (A + 1) * cosw0);
            b2 = A * ((A + 1) - (A - 1) * cosw0 - 2 * sqA * alpha);
            a0 = (A + 1) + (A - 1) * cosw0 + 2 * sqA * alpha;
            a1 = -2 * ((A - 1) + (A + 1) * cosw0);
            a2 = (A + 1) + (A - 1) * cosw0 - 2 * sqA * alpha;
            return [{ b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 }];

          case 'Lowshelf2':

            a1 = -2 * ((A - 1) + (A + 1) * cosw0);
            a2 = (A + 1) + (A - 1) * cosw0 - 2 * sqA * alpha;

            freq = params[0]; gain = params[1]; Q = params[2];

            sinw0 = Math.sin(w0); cosw0 = Math.cos(w0);
            alpha = sinw0 / (2 * Q);
            sqA = Math.sqrt(A);
            b0 = A * ((A + 1) + (A - 1) * cosw0 + 2 * sqA * alpha);
            b1 = -2 * A * ((A - 1) + (A + 1) * cosw0);
            b2 = A * ((A + 1) + (A - 1) * cosw0 - 2 * sqA * alpha);

            // First-order low shelf via bilinear transform
            freq = params[0]; gain = params[1];

            A = Math.pow(10, gain / 20);
            v0 = A;
            H0 = v0 - 1;
            if (A >= 1) {
              b0 = 1 + H0 / (1 + 1 / tn);
              b1 = H0 * (1 / (1 + 1 / tn) - 1 / (1 + tn));
              b2 = 0;
              a0 = 1;
              a1 = -1 * (1 - tn) / (1 + tn);
              a2 = 0;
              // Normalize: treat as b0 + b1*z^-1 / 1 + a1*z^-1
              // Actually let's use the standard shelf formula
            } else {

              b0 = 1 + H0 / (1 + tn);
              b1 = H0 * (1 / (1 + tn) - 1 / (1 + 1 / tn));
              b2 = 0;
              a0 = 1;
              a1 = -1 * (1 - tn) / (1 + tn);
              a2 = 0;
            }
            // Use CamillaDSP's actual first-order shelf formula
            // H(s) = (s + wc*sqrt(A)) / (s + wc/sqrt(A)) * A  [low shelf]
            // Bilinear: s = 2*fs*(z-1)/(z+1)
            var wc = 2 * Math.PI * freq;
            var fs = sampleRate;

            // s -> z via bilinear
            // Numerator: s + wp*sqrtA => 2*fs*(z-1)/(z+1) + wp*sqrtA
            // => (2*fs + wp*sqrtA)*z + (wp*sqrtA - 2*fs) / (z+1)
            // Denominator: s + wp/sqrtA => (2*fs + wp/sqrtA)*z + (wp/sqrtA - 2*fs) / (z+1)
            var bn = 2 * fs + wp * sqrtA;

            b1 = bn1 / an;
            b2 = 0;
            a0 = 1;
            a1 = an1 / an;
            a2 = 0;
            return [{ b0: b0, b1: b1, b2: 0, a1: a1, a2: 0 }];

          case 'HighshelfFO':

            freq = params[0]; gain = params[1];
            A = Math.pow(10, gain / 20);
            wc = 2 * Math.PI * freq;
            fs = sampleRate;
            sqrtA = Math.sqrt(A);
            wp = 2 * fs * Math.tan(wc / (2 * fs));
            // H(s) = A * (s*sqrtA + wc) / (s/sqrtA + wc)
            // Numerator: sqrtA*s + wc => sqrtA*2*fs*(z-1)/(z+1) + wc_p
            // => (sqrtA*2*fs + wc_p)*z + (wc_p - sqrtA*2*fs)  / (z+1)

            bn1 = wp - sqrtA * 2 * fs;

            an1 = wp - 2 * fs / sqrtA;
            // Multiply numerator by A/sqrtA = sqrtA? No.
            // Actually for high shelf: H(s) = (A*s + wc*sqrtA) / (s + wc*sqrtA)
            // Let me use the correct CamillaDSP formulation.
            // CamillaDSP HighshelfFO: first-order high-shelf
            // Using matched bilinear:
            // H(s) = (sqrtA * s + wc) / (s/sqrtA + wc) -- this gives high-shelf
            // Actually after pre-warping:
            bn = sqrtA * 2 * fs + wp;
            bn1 = -(sqrtA * 2 * fs) + wp;
            an = 2 * fs / sqrtA + wp;
            an1 = -(2 * fs / sqrtA) + wp;

            b0 = (sqrtA * bn) / an;
            b1 = (sqrtA * bn1) / an;
            b2 = 0;
            a1 = an1 / an;
            a2 = 0;
            // Hmm, let's simplify. The standard first-order high shelf bilinear result:
            // Actually let's just use the cookbook approach consistently.
            // For first-order high shelf (CamillaDSP implementation):
            // b0 = A*( (A+1) + (A-1)*... ) etc but for first order it's simpler.
            // Use a direct bilinear of H(s) = A * (s + wa/sqrtA) / (s + wa*sqrtA) where wa = prewarped

            var a1n = wp * sqrtA - 2 * fs;
            b0 = b0n / a0n;
            b1 = b1n / a0n;
            b2 = 0;
            a1 = a1n / a0n;
            a2 = 0;
            return [{ b0: b0, b1: b1, b2: 0, a1: a1, a2: 0 }];

          case 'Lowpass':

            alpha = sinw0 / (2 * Q);
            b0 = (1 - cosw0) / 2;
            b1 = 1 - cosw0;
            b2 = (1 - cosw0) / 2;
            a0 = 1 + alpha;
            a1 = -2 * cosw0;
            a2 = 1 - alpha;
            return [{ b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 }];

          case 'Highpass':
            freq = params[0]; Q = params[1];
            w0 = 2 * Math.PI * freq / sampleRate;
            sinw0 = Math.sin(w0); cosw0 = Math.cos(w0);
            alpha = sinw0 / (2 * Q);
            b0 = (1 + cosw0) / 2;
            b1 = -(1 + cosw0);
            b2 = (1 + cosw0) / 2;
            a0 = 1 + alpha;
            a1 = -2 * cosw0;
            a2 = 1 - alpha;
            return [{ b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 }];

          case 'LowpassFO':
            freq = params[0];
            w0 = 2 * Math.PI * freq / sampleRate;
            k = Math.tan(w0 / 2);
            b0 = k / (k + 1);
            b1 = k / (k + 1);
            b2 = 0;
            a1 = (k - 1) / (k + 1);
            a2 = 0;
            return [{ b0: b0, b1: b1, b2: 0, a1: a1, a2: 0 }];

          case 'HighpassFO':
            freq = params[0];
            w0 = 2 * Math.PI * freq / sampleRate;
            k = Math.tan(w0 / 2);
            b0 = 1 / (k + 1);
            b1 = -1 / (k + 1);
            b2 = 0;
            a1 = (k - 1) / (k + 1);
            a2 = 0;

            b0 = 1;
            b1 = -2 * cosw0;
            b2 = 1;
            a0 = 1 + alpha;
            a1 = -2 * cosw0;
            a2 = 1 - alpha;

            b1 = -2 * cosw0;
            b2 = 1;
            a0 = 1 + alpha;
            a1 = -2 * cosw0;
            a2 = 1 - alpha;

            var a1a = -2 * cosw0;
            var a2a = 1 - alpha;

            w0 = 2 * Math.PI * Ft / sampleRate;

            var a1t = -2 * cosw0;
            var a2t = 1 - alpha;

            // Normalized:
            return [{
              b0: a0a / a0t,
              b1: a1a / a0t,
              b2: a2a / a0t,

          case 'Tilt':

            gain = params[0];

            var halfGainLow = -gain / 2;

            sqA = Math.sqrt(A);
            b0 = A * ((A + 1) - (A - 1) * cosw0 + 2 * sqA * alpha);
            b1 = 2 * A * ((A - 1) - (A + 1) * cosw0);
            b2 = A * ((A + 1) - (A - 1) * cosw0 - 2 * sqA * alpha);
            a0 = (A + 1) + (A - 1) * cosw0 + 2 * sqA * alpha;
            a1 = -2 * ((A - 1) + (A + 1) * cosw0);
            a2 = (A + 1) + (A - 1) * cosw0 - 2 * sqA * alpha;
            var lowSection = { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 };
            // High shelf section (Highshelf2 with Q)
            var halfGainHigh = gain / 2;
            A = Math.pow(10, halfGainHigh / 40);
            w0 = 2 * Math.PI * 3500 / sampleRate;
            sinw0 = Math.sin(w0); cosw0 = Math.cos(w0);
            alpha = sinw0 / (2 * tiltQ);
            sqA = Math.sqrt(A);
            b0 = A * ((A + 1) + (A - 1) * cosw0 + 2 * sqA * alpha);
            b1 = -2 * A * ((A - 1) + (A + 1) * cosw0);
            b2 = A * ((A + 1) + (A - 1) * cosw0 - 2 * sqA * alpha);
            a0 = (A + 1) - (A - 1) * cosw0 + 2 * sqA * alpha;
            a1 = 2 * ((A - 1) - (A + 1) * cosw0);
            a2 = (A + 1) - (A - 1) * cosw0 - 2 * sqA * alpha;

        }
      }

      function butterworthBiquads(freq, order, type, sampleRate) {
        // Decompose Butterworth into cascaded biquad sections
        var sections = [];
        var nSections = Math.floor(order / 2);
        var w0, sinw0, cosw0, alpha, Q, b0, b1, b2, a0, a1, a2;

        for (var i = 0; i < nSections; i++) {
          // Q for each section of Butterworth filter
          Q = 1 / (2 * Math.cos(Math.PI * (2 * i + 1) / (2 * order)));
          w0 = 2 * Math.PI * freq / sampleRate;
          sinw0 = Math.sin(w0);
          cosw0 = Math.cos(w0);
          alpha = sinw0 / (2 * Q);

          if (type === 'lowpass') {
            b0 = (1 - cosw0) / 2;
            b1 = 1 - cosw0;
            b2 = (1 - cosw0) / 2;
          } else {
            b0 = (1 + cosw0) / 2;
            b1 = -(1 + cosw0);
            b2 = (1 + cosw0) / 2;
          }
          a0 = 1 + alpha;
          a1 = -2 * cosw0;
          a2 = 1 - alpha;
          sections.push({ b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 });
        }

        // If odd order, add a first-order section
        if (order % 2 === 1) {
          var k = Math.tan(Math.PI * freq / sampleRate);
          if (type === 'lowpass') {
            b0 = k / (k + 1);
            b1 = k / (k + 1);
            b2 = 0;
            a1 = (k - 1) / (k + 1);
            a2 = 0;
          } else {
            b0 = 1 / (k + 1);
            b1 = -1 / (k + 1);
            b2 = 0;
            a1 = (k - 1) / (k + 1);
            a2 = 0;
          }
          sections.push({ b0: b0, b1: b1, b2: 0, a1: a1, a2: 0 });
        }

        return sections;
      }

      // ========== Transfer function evaluation ==========

      function evalBiquadMagnitudeDb(biquads, freq, sampleRate) {
        // Evaluate cascaded biquad magnitude at a given frequency
        var w = 2 * Math.PI * freq / sampleRate;
        var cosw = Math.cos(w);
        var cos2w = Math.cos(2 * w);
        var sinw = Math.sin(w);
        var sin2w = Math.sin(2 * w);

        var totalMagSq = 1;
        for (var i = 0; i < biquads.length; i++) {
          var c = biquads[i];
          // Numerator: b0 + b1*e^(-jw) + b2*e^(-j2w)
          var numRe = c.b0 + c.b1 * cosw + c.b2 * cos2w;
          var numIm = -(c.b1 * sinw + c.b2 * sin2w);
          // Denominator: 1 + a1*e^(-jw) + a2*e^(-j2w)
          var denRe = 1 + c.a1 * cosw + c.a2 * cos2w;
          var denIm = -(c.a1 * sinw + c.a2 * sin2w);

          var numMagSq = numRe * numRe + numIm * numIm;
          var denMagSq = denRe * denRe + denIm * denIm;

          if (denMagSq === 0) denMagSq = 1e-20;
          totalMagSq *= numMagSq / denMagSq;
        }

        return 10 * Math.log10(totalMagSq);
      }

      // ========== Compute response curves ==========

      function computeResponses(data) {
        if (!data || !data.filters) return null;

        var sampleRate = data.sampleRate || 44100;
        var filters = data.filters.filter(function (f) {
          return f.type !== 'None';
        });

        if (filters.length === 0) {
          return { individual: [], combinedL: null, combinedR: null, combinedLR: null, sampleRate: sampleRate };
        }

        var individual = [];
        var hasL = false, hasR = false, allLR = true;

        for (var fi = 0; fi < filters.length; fi++) {
          var f = filters[fi];
          var biquads = computeBiquadCoeffs(f.type, f.params, sampleRate);
          if (biquads.length === 0) continue;

          var curve = new Float64Array(numPoints);
          for (var j = 0; j < numPoints; j++) {
            curve[j] = evalBiquadMagnitudeDb(biquads, frequencies[j], sampleRate);
          }

          individual.push({
            index: f.index,
            type: f.type,
            scope: f.scope,
            params: f.params,
            curve: curve,
            biquads: biquads,
            muted: !!f.muted
          });

          if (f.scope === 'L' || f.scope === 'L+R') hasL = true;
          if (f.scope === 'R' || f.scope === 'L+R') hasR = true;
          if (f.scope !== 'L+R') allLR = false;
        }

        // Compute combined responses
        var combinedL = null, combinedR = null, combinedLR = null;

        if (allLR && hasL) {
          // All filters are L+R, show single combined curve
          combinedLR = new Float64Array(numPoints);
          for (var j = 0; j < numPoints; j++) {
            var total = 0;
            for (var fi = 0; fi < individual.length; fi++) {
              if (!eqBypassed && !individual[fi].muted) total += individual[fi].curve[j];
            }
            combinedLR[j] = total;
          }
        } else {
          if (hasL) {
            combinedL = new Float64Array(numPoints);
            for (var j = 0; j < numPoints; j++) {
              var total = 0;
              for (var fi = 0; fi < individual.length; fi++) {
                if (!eqBypassed && !individual[fi].muted && (individual[fi].scope === 'L' || individual[fi].scope === 'L+R')) {
                  total += individual[fi].curve[j];
                }
              }
              combinedL[j] = total;
            }
          }
          if (hasR) {
            combinedR = new Float64Array(numPoints);
            for (var j = 0; j < numPoints; j++) {
              var total = 0;
              for (var fi = 0; fi < individual.length; fi++) {
                if (!eqBypassed && !individual[fi].muted && (individual[fi].scope === 'R' || individual[fi].scope === 'L+R')) {
                  total += individual[fi].curve[j];
                }
              }
              combinedR[j] = total;
            }
          }
        }

        return {
          individual: individual,
          combinedL: combinedL,
          combinedR: combinedR,
          combinedLR: combinedLR,
          sampleRate: sampleRate
        };
      }

      function computePeakFromResponses(responses) {
        if (!responses) return 0;
        var peak = 0;
        var curves = [];
        if (responses.combinedLR) curves.push(responses.combinedLR);
        if (responses.combinedL) curves.push(responses.combinedL);
        if (responses.combinedR) curves.push(responses.combinedR);
        for (var i = 0; i < curves.length; i++) {
          for (var j = 0; j < curves[i].length; j++) {
            if (curves[i][j] > peak) peak = curves[i][j];
          }
        }
        return peak;
      }

      // ========== Canvas rendering ==========

      function resizeCanvas() {
        var rect = container.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function freqToX(freq) {
        var w = canvas.width / dpr;
        var plotW = w - margin.left - margin.right;
        return margin.left + plotW * (Math.log10(freq) - logMin) / (logMax - logMin);
      }

      function xToFreq(x) {
        var w = canvas.width / dpr;
        var plotW = w - margin.left - margin.right;
        var logF = logMin + (x - margin.left) / plotW * (logMax - logMin);
        return Math.pow(10, logF);
      }

      function dbToY(db, dbMin, dbMax) {
        var h = canvas.height / dpr;
        var plotH = h - margin.top - margin.bottom;
        return margin.top + plotH * (1 - (db - dbMin) / (dbMax - dbMin));
      }

      function yToDb(y, dbMin, dbMax) {
        var h = canvas.height / dpr;
        var plotH = h - margin.top - margin.bottom;
        return dbMin + (1 - (y - margin.top) / plotH) * (dbMax - dbMin);
      }

      function formatFreq(f) {
        if (f >= 1000) return (f / 1000) + 'k';
        return f.toString();
      }

      function render(responses) {
        var w = canvas.width / dpr;
        var h = canvas.height / dpr;
        var palette = getCanvasThemePalette();

        ctx.clearRect(0, 0, w, h);

        // Determine dB range
        var isEQ15Mode = (currentMode === 'EQ15' || currentMode === '2XEQ15');
        var dbMin = isEQ15Mode ? -10 : -9;
        var dbMax = isEQ15Mode ? 10 : 9;
        if (responses) {
          var allCurves = [];
          for (var i = 0; i < responses.individual.length; i++) {
            if (isFilterVisible(responses.individual[i].scope)) {
              allCurves.push(responses.individual[i].curve);
            }
          }
          if (responses.combinedL && showL) allCurves.push(responses.combinedL);
          if (responses.combinedR && showR) allCurves.push(responses.combinedR);
          if (responses.combinedLR) allCurves.push(responses.combinedLR);

          for (var i = 0; i < allCurves.length; i++) {
            for (var j = 0; j < allCurves[i].length; j++) {
              var v = allCurves[i][j];
              if (isFinite(v)) {
                if (v < dbMin) dbMin = v;
                if (v > dbMax) dbMax = v;
              }
            }
          }
          // Add padding and ensure minimum range
          var minRange = isEQ15Mode ? 20 : 18;
          var range = dbMax - dbMin;
          if (range < minRange) {
            var mid = (dbMax + dbMin) / 2;
            dbMin = mid - minRange / 2;
            dbMax = mid + minRange / 2;
          }
          var padDb = isEQ15Mode ? 2 : 0;
          dbMin = Math.floor(dbMin / 6) * 6 - padDb;
          dbMax = Math.ceil(dbMax / 6) * 6 + padDb;
        }

        var plotW = w - margin.left - margin.right;
        var plotH = h - margin.top - margin.bottom;

        // Draw background
        ctx.fillStyle = palette.bg;
        ctx.fillRect(0, 0, w, h);

        // Draw grid - vertical (frequency)
        ctx.strokeStyle = palette.gridSoft;
        ctx.lineWidth = 0.5;
        ctx.font = '11px Lato, sans-serif';
        ctx.fillStyle = palette.secondary;
        ctx.textAlign = 'center';

        for (var i = 0; i < gridFreqs.length; i++) {
          var x = freqToX(gridFreqs[i]);
          ctx.beginPath();
          ctx.moveTo(x, margin.top);
          ctx.lineTo(x, h - margin.bottom);
          ctx.stroke();
          ctx.fillText(formatFreq(gridFreqs[i]), x, h - margin.bottom + 16);
        }

        // Draw grid - horizontal (dB)
        ctx.textAlign = 'right';
        for (var db = dbMin; db <= dbMax; db += 6) {
          var y = dbToY(db, dbMin, dbMax);
          if (db === 0) {
            ctx.strokeStyle = palette.text;
            ctx.lineWidth = 0.8;
            ctx.setLineDash([5, 5]);
          } else {
            ctx.strokeStyle = palette.gridSoft;
            ctx.lineWidth = 0.5;
            ctx.setLineDash([]);
          }
          ctx.beginPath();
          ctx.moveTo(margin.left, y);
          ctx.lineTo(w - margin.right, y);
          ctx.stroke();
          ctx.fillStyle = db === 0 ? palette.text : palette.secondary;
          ctx.fillText(db + ' dB', margin.left - 8, y + 4);
        }
        ctx.setLineDash([]);

        // Draw axis labels
        ctx.fillStyle = palette.axis;
        ctx.textAlign = 'center';
        ctx.fillText('Hz', w - margin.right + 15, h - margin.bottom + 16);

        if (!responses || responses.individual.length === 0) {
          // Draw flat line at 0dB
          var y0 = dbToY(0, dbMin, dbMax);
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(margin.left, y0);
          ctx.lineTo(w - margin.right, y0);
          ctx.stroke();
          return;
        }

        // Draw peak gain line
        if (currentPeakGain > 0) {
          var peakY = dbToY(currentPeakGain, dbMin, dbMax);
          if (peakY >= margin.top && peakY <= h - margin.bottom) {
            ctx.strokeStyle = '#e9a645';
            ctx.lineWidth = 1;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(margin.left, peakY);
            ctx.lineTo(w - margin.right, peakY);
            ctx.stroke();
            ctx.setLineDash([]);
            // Y-axis label
            ctx.fillStyle = '#e9a645';
            ctx.textAlign = 'right';
            ctx.font = '10px Lato, sans-serif';
            ctx.fillText('+' + currentPeakGain.toFixed(1), margin.left - 8, peakY + 4);
          }
        }

        // Draw individual filter curves
        for (var fi = 0; fi < responses.individual.length; fi++) {
          var ind = responses.individual[fi];
          if (!isFilterVisible(ind.scope)) continue;
          var color = filterColors[fi % filterColors.length];
          var isMuted = eqBypassed || ind.muted;
          ctx.strokeStyle = color;
          ctx.globalAlpha = isMuted ? 0.15 : 0.4;
          ctx.lineWidth = 1;
          if (isMuted) ctx.setLineDash([4, 4]);
          ctx.beginPath();
          for (var j = 0; j < numPoints; j++) {
            var x = freqToX(frequencies[j]);
            var y = dbToY(ind.curve[j], dbMin, dbMax);
            if (j === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1.0;
        }

        // Draw combined curves with transparent green fill
        if (responses.combinedLR) {
          drawCurveWithFill(responses.combinedLR, '#54C688', 3, dbMin, dbMax);
        }
        if (responses.combinedL && showL) {
          drawCurveWithFill(responses.combinedL, '#4CAF50', 2.5, dbMin, dbMax);
        }
        if (responses.combinedR && showR) {
          drawCurveWithFill(responses.combinedR, '#2196F3', 2.5, dbMin, dbMax);
        }

        // Draw numbered PEQ markers at each filter's center frequency (on top of all curves)
        for (var fi = 0; fi < responses.individual.length; fi++) {
          var ind = responses.individual[fi];
          if (!isFilterVisible(ind.scope)) continue;
          var color = filterColors[fi % filterColors.length];
          var markerFreq, markerDb;
          if (ind.type === 'Tilt') {
            markerFreq = 1000;
            markerDb = 0;
          } else {
            markerFreq = ind.params[0];
            markerDb = evalBiquadMagnitudeDb(ind.biquads, markerFreq, responses.sampleRate);
          }
          if (markerFreq < fMin || markerFreq > fMax) continue;
          if (!isFinite(markerDb)) continue;
          var mx = freqToX(markerFreq);
          var my = dbToY(markerDb, dbMin, dbMax);
          // Clamp to plot area
          if (my < margin.top) my = margin.top;
          if (my > h - margin.bottom) my = h - margin.bottom;
          var label = '' + ind.index;
          var isActive = (fi === dragFilterIndex || fi === selectedFilterIndex || fi === hoveredFilterIndex);
          var isMuted = eqBypassed || ind.muted;
          var isEQ15Mode = (currentMode === 'EQ15' || currentMode === '2XEQ15');

          if (isEQ15Mode) {
            // Draw vertical slider line for EQ15/2XEQ15 modes (between ±10dB)
            var lineTopY = dbToY(10, dbMin, dbMax);
            var lineBottomY = dbToY(-10, dbMin, dbMax);

            // Draw thin vertical line above handle
            ctx.globalAlpha = isMuted ? 0.2 : 0.35;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(mx, lineTopY);
            ctx.lineTo(mx, my);
            ctx.stroke();

            // Draw thicker vertical line below handle
            ctx.lineWidth = 20;
            ctx.beginPath();
            ctx.moveTo(mx, my);
            ctx.lineTo(mx, lineBottomY);
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // Draw larger handle (circle) at current gain position
            var handleRadius = isActive ? 16 : 9;
            if (isActive && !isMuted) {
              ctx.save();
              ctx.shadowColor = color;
              ctx.shadowBlur = 12;
            }
            ctx.globalAlpha = isMuted ? 0.35 : 1.0;
            ctx.beginPath();
            ctx.arc(mx, my, handleRadius, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = isMuted ? '#999' : '#333';
            ctx.lineWidth = isActive ? 2 : 1.5;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            if (isActive && !isMuted) {
              ctx.restore();
            }

            // Number label (at bottom)
            ctx.globalAlpha = isMuted ? 0.5 : 1.0;
            ctx.fillStyle = '#fff';
            ctx.font = isActive ? 'bold 11px Lato, sans-serif' : 'bold 10px Lato, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, mx, lineBottomY + 14);
            ctx.globalAlpha = 1.0;
          } else {
            // Draw point marker for non-EQ15 modes
            var radius = isActive ? 18 : 10;
            // Glow effect for active dot
            if (isActive && !isMuted) {
              ctx.save();
              ctx.shadowColor = color;
              ctx.shadowBlur = 12;
            }
            // Filled circle
            ctx.globalAlpha = isMuted ? 0.35 : 1.0;
            ctx.beginPath();
            ctx.arc(mx, my, radius, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            // Dark outline for contrast (dashed for muted)
            ctx.strokeStyle = isMuted ? '#999' : '#333';
            ctx.lineWidth = isActive ? 2 : 1.5;
            if (isMuted) ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
            if (isActive && !isMuted) {
              ctx.restore();
            }
            // Number label
            ctx.globalAlpha = isMuted ? 0.5 : 1.0;
            ctx.fillStyle = '#fff';
            ctx.font = isActive ? 'bold 11px Lato, sans-serif' : 'bold 10px Lato, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, mx, my + 3.5);
            ctx.globalAlpha = 1.0;
          }
        }

        // Draw crosshair (with snap support) only while dragging
        if (dragging && mouseX >= margin.left && mouseX <= w - margin.right &&
          mouseY >= margin.top && mouseY <= h - margin.bottom) {
          var crossX = (snappedState) ? snappedState.x : mouseX;
          // Vertical line
          if (snappedState) {
            ctx.strokeStyle = 'rgba(84, 198, 136, 0.5)';
            ctx.lineWidth = 1;
          } else {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 0.5;
          }
          ctx.beginPath();
          ctx.moveTo(crossX, margin.top);
          ctx.lineTo(crossX, h - margin.bottom);
          ctx.stroke();
          // Horizontal line (always follows mouse)
          ctx.strokeStyle = 'rgba(255,255,255,0.3)';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(margin.left, mouseY);
          ctx.lineTo(w - margin.right, mouseY);
          ctx.stroke();
        }

        // Store dbMin/dbMax for crosshair
        render.dbMin = dbMin;
        render.dbMax = dbMax;
      }

      function drawCurve(curve, color, lineWidth, dbMin, dbMax) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        for (var j = 0; j < numPoints; j++) {
          var x = freqToX(frequencies[j]);
          var y = dbToY(curve[j], dbMin, dbMax);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      function drawCurveWithFill(curve, color, lineWidth, dbMin, dbMax) {
        // Draw transparent fill between curve and zero line
        // Blue for positive values, green for negative values
        var zeroY = dbToY(0, dbMin, dbMax);

        // Draw fill areas for positive values (blue)
        ctx.fillStyle = 'rgba(33, 150, 243, 0.25)'; // Transparent blue for positive
        ctx.beginPath();
        var inPositive = false;
        for (var j = 0; j < numPoints; j++) {
          var x = freqToX(frequencies[j]);
          var y = dbToY(curve[j], dbMin, dbMax);
          var isPositive = curve[j] > 0;

          if (isPositive && !inPositive && j > 0) {
            // Start of positive section - draw from zero line
            var prevX = freqToX(frequencies[j - 1]);
            ctx.moveTo(prevX, zeroY);
            ctx.lineTo(x, y);
            inPositive = true;
          } else if (isPositive && inPositive) {
            // Continue in positive section
            ctx.lineTo(x, y);
          } else if (!isPositive && inPositive) {
            // End of positive section - back to zero line
            ctx.lineTo(x, zeroY);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            inPositive = false;
          }
        }
        if (inPositive) {
          var lastX = freqToX(frequencies[numPoints - 1]);
          ctx.lineTo(lastX, zeroY);
          ctx.closePath();
          ctx.fill();
        }

        // Draw fill areas for negative values (green)
        ctx.fillStyle = 'rgba(84, 198, 136, 0.25)'; // Transparent green for negative
        ctx.beginPath();
        var inNegative = false;
        for (var j = 0; j < numPoints; j++) {
          var x = freqToX(frequencies[j]);
          var y = dbToY(curve[j], dbMin, dbMax);
          var isNegative = curve[j] < 0;

          if (isNegative && !inNegative && j > 0) {
            // Start of negative section - draw from zero line
            var prevX = freqToX(frequencies[j - 1]);
            ctx.moveTo(prevX, zeroY);
            ctx.lineTo(x, y);
            inNegative = true;
          } else if (isNegative && inNegative) {
            // Continue in negative section
            ctx.lineTo(x, y);
          } else if (!isNegative && inNegative) {
            // End of negative section - back to zero line
            ctx.lineTo(x, zeroY);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            inNegative = false;
          }
        }
        if (inNegative) {
          var lastX = freqToX(frequencies[numPoints - 1]);
          ctx.lineTo(lastX, zeroY);
          ctx.closePath();
          ctx.fill();
        }

        // Draw the curve line on top
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        for (var j = 0; j < numPoints; j++) {
          var x = freqToX(frequencies[j]);
          var y = dbToY(curve[j], dbMin, dbMax);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // ========== Hit-testing ==========

      function hitTestMarker(mx, my, responses) {
        if (!responses) return -1;
        var w = canvas.width / dpr;
        var h = canvas.height / dpr;
        var isEQ15Mode = (currentMode === 'EQ15' || currentMode === '2XEQ15');
        // Iterate in reverse so topmost (last drawn) is tested first
        for (var fi = responses.individual.length - 1; fi >= 0; fi--) {
          var ind = responses.individual[fi];
          if (!isFilterVisible(ind.scope)) continue;
          var markerFreq, markerDb;
          if (ind.type === 'Tilt') {
            markerFreq = 1000;
            markerDb = 0;
          } else {
            markerFreq = ind.params[0];
            markerDb = evalBiquadMagnitudeDb(ind.biquads, markerFreq, responses.sampleRate);
          }
          if (markerFreq < fMin || markerFreq > fMax) continue;
          if (!isFinite(markerDb)) continue;
          var dotX = freqToX(markerFreq);
          var dotY = dbToY(markerDb, lastDbMin, lastDbMax);
          if (dotY < margin.top) dotY = margin.top;
          if (dotY > h - margin.bottom) dotY = h - margin.bottom;

          if (isEQ15Mode) {
            // For EQ15/2XEQ15, hit test the vertical slider line with tolerance
            var sliderTolerance = 12;  // pixels on either side of the line
            var sliderTopY = margin.top;
            var sliderBottomY = h - margin.bottom;
            // Check if click is within tolerance of the vertical line and within the plot area
            if (Math.abs(mx - dotX) <= sliderTolerance &&
              my >= sliderTopY && my <= sliderBottomY) {
              return fi;
            }
          } else {
            // For non-EQ15 modes, hit test the circular marker
            var dx = mx - dotX;
            var dy = my - dotY;
            if (dx * dx + dy * dy <= 14 * 14) return fi;
          }
        }
        return -1;
      }

      // ========== Client-side validation ==========

      function validateParams(type, params) {
        if (type === 'Tilt') {
          var g = Number(params[0]);
          if (!isFinite(g) || g <= -100.1 || g >= 100.1) return 'Gain must be between -100 and 100';
          return null;
        }
        var freq = Number(params[0]);
        if (type !== 'None') {
          if (!isFinite(freq) || freq <= 0 || freq >= 22050) return 'Frequency must be between 0 and 22050 Hz';
        }
        var meta = filterTypeMeta[type];
        if (!meta) return 'Unknown filter type';

        if (meta.hasGain) {
          var g = Number(params[1]);
          var isEQ15v = (currentMode === 'EQ15' || currentMode === '2XEQ15');
          var gainMax = isEQ15v ? 10.1 : 20.1;
          var gainLabel = isEQ15v ? '10' : '20';
          if (!isFinite(g) || g <= -gainMax || g >= gainMax) return 'Gain must be between -' + gainLabel + ' and ' + gainLabel + ' dB';
        }
        if (type === 'Peaking' || type === 'Highshelf2' || type === 'Lowshelf2') {
          var q = Number(params[2]);
          if (!isFinite(q) || q <= 0 || q >= 40.1) return 'Q must be between 0 and 40';
        }
        if (type === 'Peaking2') {
          var bw = Number(params[2]);
          if (!isFinite(bw) || bw <= 0 || bw >= 8) return 'Bandwidth must be between 0 and 8';
        }
        if (type === 'Highpass' || type === 'Lowpass' || type === 'Notch') {
          var q = Number(params[1]);
          if (!isFinite(q) || q <= 0 || q >= 40.1) return 'Q must be between 0 and 40';
        }
        if (type === 'Highpass2' || type === 'Lowpass2' || type === 'Notch2') {
          var bw = Number(params[1]);
          if (!isFinite(bw) || bw <= 0 || bw >= 25.1) return 'Bandwidth must be between 0 and 25';
        }
        if (type === 'Highshelf' || type === 'Lowshelf') {
          var s = Number(params[2]);
          if (!isFinite(s) || s <= 0 || s >= 13) return 'Slope must be between 0 and 13';
        }
        if (type === 'ButterworthHighpass' || type === 'ButterworthLowpass') {
          var order = Number(params[1]);
          if ([2, 4, 6, 8].indexOf(order) === -1) return 'Order must be 2, 4, 6, or 8';
        }
        if (type === 'LinkwitzTransform') {
          var qa = Number(params[1]);
          var ft = Number(params[2]);
          var qt = Number(params[3]);
          if (!isFinite(qa) || qa <= 0 || qa >= 40.1) return 'Qa must be between 0 and 40';
          if (!isFinite(ft) || ft <= 0 || ft >= 22050) return 'Ft must be between 0 and 22050 Hz';
          if (!isFinite(qt) || qt <= 0 || qt >= 40.1) return 'Qt must be between 0 and 40';
        }
        return null;
      }

      // ========== POST to backend ==========

      function postFilterUpdate(filterIndex, params, type, scope, matchScope, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/peq', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.onload = function () {
          if (xhr.status === 200) {
            try {
              var resp = JSON.parse(xhr.responseText);
              if (!resp.error) markUnsaved();
              if (callback) callback(resp.error || null);
            } catch (e) {
              if (callback) callback('Invalid response');
            }
          } else {
            try {
              var resp = JSON.parse(xhr.responseText);
              if (callback) callback(resp.error || 'Server error');
            } catch (e) {
              if (callback) callback('Server error');
            }
          }
        };
        xhr.onerror = function () {
          if (callback) callback('Network error');
        };
        var filterData = { index: filterIndex, params: params };
        if (type) filterData.type = type;
        if (scope) filterData.scope = scope;
        if (matchScope) filterData.matchScope = matchScope;
        xhr.send(JSON.stringify({ filters: [filterData] }));
      }

      // ========== Filter lookup helper (disambiguates L/R in 2XEQ15) ==========

      function findFilterIdx(filters, index, scope) {
        for (var j = 0; j < filters.length; j++) {
          if (filters[j].index === index && filters[j].scope === scope) return j;
        }
        // Fallback: match by index only (PEQ/EQ15 with L+R scope)
        for (var j = 0; j < filters.length; j++) {
          if (filters[j].index === index) return j;
        }
        return -1;
      }

      // ========== Popup ==========

      function getPopupParams() {
        var knobs = document.querySelectorAll('#popup-params-container .knob-container');
        var ep = [];
        for (var j = 0; j < knobs.length; j++) {
          ep.push(knobs[j]._knobState ? knobs[j]._knobState.value : 0);
        }
        return ep;
      }

      function getDefaultParamsForType(type, preserveFreq) {
        var defaults = filterTypeDefaults[type] || [1000];
        var params = defaults.slice();
        if (type !== 'Tilt' && isFinite(preserveFreq) && preserveFreq > 0) {
          params[0] = preserveFreq;
        }
        return params;
      }

      function rebuildPopupParams(type, params, ind) {
        var paramsContainer = document.getElementById('popup-params-container');
        var meta = filterTypeMeta[type];
        if (!meta) { paramsContainer.innerHTML = ''; return; }

        paramsContainer.innerHTML = '';
        var isEQ15 = (currentMode === 'EQ15' || currentMode === '2XEQ15');

        for (var i = 0; i < meta.paramLabels.length; i++) {
          // In EQ15 mode, only show the Gain knob (params index 1 for Peaking)
          if (isEQ15 && i !== 1) continue;

          var label = meta.paramLabels[i];
          var val = (i < params.length) ? params[i] : 0;
          var config = getKnobConfig(label, type);
          var knobEl = createKnob(i, label, val, config);

          attachKnobInteraction(knobEl, config, i, function (paramIdx, newValue) {
            var f = currentData.filters;
            var fIdx = findFilterIdx(f, ind.index, ind.scope);
            if (fIdx >= 0) {
              f[fIdx].params[paramIdx] = newValue;
            }
            renderLocal();
            var errEl = document.getElementById('popup-error-text');
            var ep = getPopupParams();
            // In EQ15 mode, reconstruct full params with original freq/Q
            if (isEQ15) {
              var origParams = ind.params.slice();
              origParams[1] = ep[0]; // knob value is the only one shown
              ep = origParams;
            }
            var err = validateParams(popupCurrentType, ep);
            if (errEl) errEl.textContent = err || '';
          });

          paramsContainer.appendChild(knobEl);
        }
      }

      function showPopup(fi) {
        if (!lastResponses || fi < 0 || fi >= lastResponses.individual.length) return;
        var ind = lastResponses.individual[fi];
        var meta = filterTypeMeta[ind.type];
        if (!meta) return;

        selectedFilterIndex = fi;
        interacting = true;
        clearInteractionTimer();
        popupSnapshotData = JSON.parse(JSON.stringify(currentData));
        popupCurrentType = ind.type;

        // Build popup HTML with type selector and scope selector
        var isEQ15 = (currentMode === 'EQ15' || currentMode === '2XEQ15');
        var html = '<div class="popup-title">Eq' + ind.index + (isEQ15 ? ' [' + ind.scope + ']' : '') + '</div>';
        if (!isEQ15) {
          html += '<div class="popup-row"><label>Type</label><select id="popup-type-select">';
          for (var ti = 0; ti < filterTypeOptions.length; ti++) {
            var opt = filterTypeOptions[ti];
            var sel = (opt.value === ind.type) ? ' selected' : '';
            html += '<option value="' + opt.value + '"' + sel + '>' + opt.label + '</option>';
          }
          html += '</select></div>';
          html += '<div class="popup-row"><label>Scope</label><select id="popup-scope-select">';
          var scopeOptions = ['L+R', 'L', 'R'];
          for (var si = 0; si < scopeOptions.length; si++) {
            var ssel = (scopeOptions[si] === ind.scope) ? ' selected' : '';
            html += '<option value="' + scopeOptions[si] + '"' + ssel + '>' + scopeOptions[si] + '</option>';
          }
          html += '</select></div>';
        }
        html += '<div id="popup-params-container"></div>';
        html += '<div class="popup-error" id="popup-error-text"></div>';
        var deleteDisabled = isEQ15 || (currentData && currentData.filters.length <= 1) ? ' disabled title="Cannot remove this filter"' : '';
        html += '<div class="popup-buttons">';
        var muteClass = ind.muted ? 'mute-btn muted' : 'mute-btn';
        var muteLabel = ind.muted ? 'Unmute' : 'Mute';
        html += '<button class="' + muteClass + '" id="popup-mute">' + muteLabel + '</button>';
        if (!isEQ15) {
          html += '<button class="delete-btn" id="popup-delete"' + deleteDisabled + '>Delete</button>';
        }
        html += '<button class="cancel-btn" id="popup-cancel">Cancel</button>' +
          '<button class="apply-btn" id="popup-apply">Apply</button></div>';

        popupEl.innerHTML = html;
        popupEl.style.display = 'block';

        // Build initial parameter fields before measuring popup height.
        rebuildPopupParams(ind.type, ind.params.slice(), ind);

        // Position popup based on gain value to avoid hiding the edited curve
        var markerFreq = ind.type === 'Tilt' ? 1000 : ind.params[0];

        // 1. Calculate the X position of the filter handle relative to the screen

        popupEl.style.setProperty('bottom', 'auto', 'important');
        popupEl.style.setProperty('transform', 'none', 'important');

// --- Start of Connector Line Logic ---
var lineSvg = document.getElementById('popup-connector-svg');
var lineEl = document.getElementById('popup-connector-line');

var filterColor = '#e9a645'; // Default orange for 'Both'
if (fi.scope === 'L') {
    filterColor = '#4fc3f7'; // Blue for Left
} else if (fi.scope === 'R') {

}

// 1. Calculate Point Position (Screen Pixels)
var isEQ15Mode = (currentMode === 'EQ15' || currentMode === '2XEQ15');
var dMin = isEQ15Mode ? -15 : -15;
var dMax = isEQ15Mode ? 15 : 15;
var pointX = containerRect.left + freqToX(markerFreq);
var pointY = containerRect.top + dbToY(markerDb, dMin, dMax);

var connectorY = (markerDb > 0) ? pTop : (pTop + ph);

lineEl.setAttribute('x1', pointX);
lineEl.setAttribute('y1', pointY);
lineEl.setAttribute('x2', connectorX);
lineEl.setAttribute('y2', connectorY);
lineEl.style.stroke = filterColor;
lineSvg.style.display = 'block';
// --- End of Connector Line Logic ---


        var finalRect = popupEl.getBoundingClientRect();
        if (finalRect.bottom > window.innerHeight - 10) {

        // Type change handler (not available in EQ15 mode)

      function closePopup() {
        popupEl.style.display = 'none';
        popupEl.innerHTML = '';
        selectedFilterIndex = -1;
        document.getElementById('popup-connector-svg').style.display = 'none';
        popupCurrentType = null;
      }

      function revertAndClosePopup() {
        if (popupSnapshotData) {
          currentData = popupSnapshotData;
          popupSnapshotData = null;
          renderLocal();
        }
        closePopup();
        scheduleInteractionEnd();
      }

      // Close popup on Escape key (global)
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && selectedFilterIndex >= 0) {
          revertAndClosePopup();
        }
      });

      // ========== Interaction timer ==========

      function clearInteractionTimer() {
        if (interactionEndTimer) {
          clearTimeout(interactionEndTimer);
          interactionEndTimer = null;
        }
      }

      function scheduleInteractionEnd() {
        clearInteractionTimer();
        interactionEndTimer = setTimeout(function () {
          interacting = false;
          fetchAndRender();
        }, 2000);
      }

      // ========== Channel toggle helpers ==========

      function isFilterVisible(scope) {
        if (scope === 'L') return showL;
        if (scope === 'R') return showR;
        return showL || showR;
      }

      function updateChannelToggleVisibility(responses) {
        var hasSeparateLR = responses && (responses.combinedL !== null || responses.combinedR !== null);
        btnToggleLeft.style.display = hasSeparateLR ? '' : 'none';
        btnToggleRight.style.display = hasSeparateLR ? '' : 'none';
        if (!hasSeparateLR) {
          showL = true;
          showR = true;
          btnToggleLeft.classList.add('active');
          btnToggleRight.classList.add('active');
        }
      }

      // ========== Local render helper ==========

      function renderLocal() {
        if (!currentData) return;
        var responses = computeResponses(currentData);
        if (responses) {
          lastResponses = responses;
          lastDbMin = render.dbMin || -15;
          lastDbMax = render.dbMax || 15;
          updateChannelToggleVisibility(responses);
          resizeCanvas();
          render(responses);
          updateLegend(responses);
          updateOctaveTable(responses);
        }
      }

      // ========== Legend ==========

      function curveMinMax(curve) {
        var mn = Infinity, mx = -Infinity;
        for (var j = 0; j < curve.length; j++) {
          var v = curve[j];
          if (isFinite(v)) {
            if (v < mn) mn = v;
            if (v > mx) mx = v;
          }
        }
        return { min: mn, max: mx };
      }

      function updateLegend(responses) {
        legendEl.innerHTML = '';
        if (!responses) return;

        // Individual filters
        for (var i = 0; i < responses.individual.length; i++) {
          var ind = responses.individual[i];
          if (!isFilterVisible(ind.scope)) continue;
          var color = filterColors[i % filterColors.length];
          var paramStr = ind.params.join(', ');
          // Compute peak dB for this filter
          var mm = curveMinMax(ind.curve);
          var peakStr = '';
          if (isFinite(mm.min) && isFinite(mm.max)) {
            var peak = Math.abs(mm.max) >= Math.abs(mm.min) ? mm.max : mm.min;
            peakStr = ' peak: ' + peak.toFixed(1) + ' dB';
          }
          var div = document.createElement('div');
          div.className = 'legend-item';
          div.innerHTML = '<span class="legend-color" style="background:' + color + '"></span>' +
            '<span>Eq' + ind.index + ' ' + ind.type + ' [' + ind.scope + '] (' + paramStr + ')' + peakStr + '</span>';
          legendEl.appendChild(div);
        }

        // Combined curves
        if (responses.combinedLR) {
          var mm = curveMinMax(responses.combinedLR);
          addLegendItem('Combined L+R (min: ' + mm.min.toFixed(1) + ' / max: ' + mm.max.toFixed(1) + ' dB)', '#54C688');
        }
        if (responses.combinedL && showL) {
          var mm = curveMinMax(responses.combinedL);
          addLegendItem('Combined L (min: ' + mm.min.toFixed(1) + ' / max: ' + mm.max.toFixed(1) + ' dB)', '#4CAF50');
        }
        if (responses.combinedR && showR) {
          var mm = curveMinMax(responses.combinedR);
          addLegendItem('Combined R (min: ' + mm.min.toFixed(1) + ' / max: ' + mm.max.toFixed(1) + ' dB)', '#2196F3');
        }
      }

      function addLegendItem(label, color) {
        var div = document.createElement('div');
        div.className = 'legend-item';
        div.innerHTML = '<span class="legend-color" style="background:' + color + '; height: 4px;"></span>' +
          '<span style="font-weight:600;">' + label + '</span>';
        legendEl.appendChild(div);
      }

      // ========== 1/3-Octave Table ==========

      function formatOctaveFreq(f) {
        if (f >= 1000) return (f / 1000) + 'k';
        return f.toString();
      }

      function updateOctaveTable(responses) {
        if (!responses || !responses.individual || responses.individual.length === 0) {
          octaveTableEl.innerHTML = '';
          return;
        }

        var sr = responses.sampleRate || 44100;
        var allLR = true;
        var hasL = false, hasR = false;
        for (var i = 0; i < responses.individual.length; i++) {
          var s = responses.individual[i].scope;
          if (s !== 'L+R') allLR = false;
          if (s === 'L' || s === 'L+R') hasL = true;
          if (s === 'R' || s === 'L+R') hasR = true;
        }
        var separate = !allLR && hasL && hasR;

        var html = '';
        for (var fi = 0; fi < thirdOctaveFreqs.length; fi++) {
          var freq = thirdOctaveFreqs[fi];
          html += '<div class="octave-col">';

          if (separate) {
            // Compute L and R separately
            var dbL = 0, dbR = 0;
            for (var i = 0; i < responses.individual.length; i++) {
              var ind = responses.individual[i];
              if (ind.biquads && ind.biquads.length > 0) {
                var db = evalBiquadMagnitudeDb(ind.biquads, freq, sr);
                if (ind.scope === 'L' || ind.scope === 'L+R') dbL += db;
                if (ind.scope === 'R' || ind.scope === 'L+R') dbR += db;
              }
            }
            if (showL && showR) {
              html += '<span class="octave-val-lr left">' + dbL.toFixed(1) + '</span>';
              html += '<span class="octave-val-lr right">' + dbR.toFixed(1) + '</span>';
            } else if (showL) {
              var clsL = dbL > 0.05 ? 'positive' : (dbL < -0.05 ? 'negative' : 'zero');
              html += '<span class="octave-val ' + clsL + '">' + dbL.toFixed(1) + '</span>';
            } else if (showR) {
              var clsR = dbR > 0.05 ? 'positive' : (dbR < -0.05 ? 'negative' : 'zero');
              html += '<span class="octave-val ' + clsR + '">' + dbR.toFixed(1) + '</span>';
            } else {
              html += '<span class="octave-val zero">0.0</span>';
            }
          } else {
            // Combined
            var dbC = 0;
            for (var i = 0; i < responses.individual.length; i++) {
              var ind = responses.individual[i];
              if (ind.biquads && ind.biquads.length > 0) {
                dbC += evalBiquadMagnitudeDb(ind.biquads, freq, sr);
              }
            }
            var cls = dbC > 0.05 ? 'positive' : (dbC < -0.05 ? 'negative' : 'zero');
            html += '<span class="octave-val ' + cls + '">' + dbC.toFixed(1) + '</span>';
          }

          html += '<span class="octave-freq">' + formatOctaveFreq(freq) + '</span>';
          html += '</div>';
